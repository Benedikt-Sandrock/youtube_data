[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube_data"
version = "0.1.0"
dependencies = [
    "pandas",
    "google-api-python-client",
    "python-dateutil",
    "youtube_transcript_api",
    "langdetect",
    "yt_dlp",
    "openpyxl",
    "python-dotenv",
    "matplotlib",
    "seaborn",
    "matplotlib-venn",
    "numpy",
    "transformers",
    "scikit-learn",
    "google-genai",
    "google-cloud-storage",
    "scipy",
    "json_repair",
    "statsmodels",
]

[tool.setuptools.packages.find]
where = ["."]